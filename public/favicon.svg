<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Drape Digital</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D1FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <!-- Stylized "D" with draped fold effect -->
  <!-- Main D stroke -->
  <path d="M18 14 L18 50 L32 50 C44 50 50 42 50 32 C50 22 44 14 32 14 Z" fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner drape fold lines creating depth -->
  <path d="M24 20 L24 44 L32 44 C40 44 44 39 44 32 C44 25 40 20 32 20 Z" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linejoin="round" opacity="0.4"/>
  <!-- Flowing drape accent line -->
  <path d="M18 26 C26 24 34 30 42 28" fill="none" stroke="#00D1FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M18 36 C28 34 36 40 46 36" fill="none" stroke="#00D1FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Accent dot -->
  <circle cx="48" cy="46" r="3" fill="#00D1FF"/>
</svg>
